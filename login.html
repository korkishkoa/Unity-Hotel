<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Resort | Вхід</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<section class="login-page">
    <div class="login-container">
        <h2>Вхід до системи <i class="fas fa-lock"></i></h2>
        <p class="hero-subtitle" style="color: var(--white);">Увійдіть як Користувач або Адміністратор</p>

        <form>
            <div class="form-group">
                <label for="email">Електронна пошта</label>
                <input type="email" id="email" placeholder="user@resort.com або admin@resort.com" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="********" class="form-input" required>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label for="role" style="color: var(--accent-green);">роль для входу</label>
                <select id="role" class="form-input" onchange="updateLoginButton()">
                    <option value="user">Користувач </option>
                    <option value="admin">Адміністратор </option>
                </select>
            </div>

            <button type="button" id="login-btn" class="btn-primary btn-login" onclick="imitateLogin()">
                <i class="fas fa-sign-in-alt"></i> Увійти як Користувач
            </button>

            <p class="login-message">
                Немає облікового запису? <a href="register.html" style="color: var(--accent-green);">давай бігом</a> | <a href="index.html" style="color: var(--accent-green);">На головну</a>
            </p>
        </form>
    </div>
</section>

<div class="nav-overlay"></div>

<script>
    // Імітація логіки переходу на основі обраної ролі
    function imitateLogin() {
        const role = document.getElementById('role').value;
        if (role === 'admin') {
            window.location.href = 'admin.html';
        } else {
            window.location.href = 'user.html';
        }
    }

    function updateLoginButton() {
        const role = document.getElementById('role').value;
        const btn = document.getElementById('login-btn');
        if (role === 'admin') {
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Увійти як Адміністратор';
        } else {
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Увійти як Користувач';
        }
    }
</script>
</body>
</html>
